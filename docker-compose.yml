# Alternativa a `npm run db:local`: PostgreSQL en Docker.
# Uso: docker compose up -d   (luego, en backend/: npm run prisma:deploy && npm run db:seed)
services:
  db:
    image: postgres:17
    container_name: tutorapp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tutorapp
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - tutorapp-datos:/var/lib/postgresql/data

volumes:
  tutorapp-datos:
